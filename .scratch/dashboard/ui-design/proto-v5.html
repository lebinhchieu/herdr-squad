<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>(6) board</title><style>
/* every colour is a token of mango-parrot-color-theme.json (light); see design-v3.md for the token per colour */
:root{--u:1;--r:10px;

--t-need3:#E8820E12;/* list.hoverBackground */

--t-work:#368A1E18; /* mergeEditor.change.background */
--t-bad:#DB3B2212;  /* diffEditor.removedLineBackground */

*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:calc(12px*var(--u))/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
code.nb,.tbl code{white-space:nowrap}

h1,h2,h3{margin:0}p{margin:3px 0}
.muted{color:var(--muted)}.sm{font-size:.875em}.ap{font-size:.83em;font-style:italic;color:var(--muted);margin-left:3px}
button{font:inherit;color:var(--ink);cursor:pointer}

.demo{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:4px 12px;border-bottom:1px dashed var(--muted2);color:var(--muted);background:var(--panel2)}

.pick select,.fsel select{font:inherit;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--ink);padding:1px 4px}

.fr{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fresh{color:var(--muted);white-space:nowrap}.fresh .dot{display:inline-block;width:.67em;height:.67em;border-radius:50%;background:var(--work);margin-right:3px}
.fresh.bad{color:var(--err)}.fresh.bad .dot{background:var(--block)}.fresh.load .dot{background:var(--muted2)}
.hb{border:1px solid var(--border);background:var(--bg);border-radius:6px;padding:1px 9px}

.seg{display:inline-flex;align-items:center;border:1px solid var(--border);border-radius:8px;background:var(--bg);overflow:hidden}
.seg button{border:0;background:transparent;padding:1px 9px}.seg button:hover{background:var(--t-need3)}.seg button[disabled]{opacity:.35;cursor:default}
.seg span{padding:0 8px;border-left:1px solid var(--border);border-right:1px solid var(--border);min-width:6.2em;text-align:center}
.zone{border:1px solid var(--border);border-radius:10px;padding:0 8px;background:var(--bg);white-space:nowrap}.zone b{font-weight:700}
.srcs{display:inline-flex;gap:4px;flex-wrap:wrap;align-items:center}
.src{border:1px solid var(--border);border-radius:10px;padding:0 7px;background:var(--bg);color:var(--muted);white-space:nowrap}
.src i{display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--work);margin-right:3px}
.src.bad{border-style:dashed;border-color:var(--muted);color:var(--ink)}.src.bad i{background:var(--bg);border:1px solid var(--muted)}
.prefs{color:var(--muted)}.prefs.warn{color:var(--ink);border:1px solid var(--amber);background:var(--t-amber);border-radius:10px;padding:0 8px;font-weight:600}
/* chips: text is always ink; the state is the border and tint */
/* chips: text is always ink; the state is the border and tint (v4: flex centring is in the v4 block at the end) */
.chip{display:inline-flex;border-radius:.8em;padding:0 .6em;font-size:.92em;font-weight:600;border:1px solid var(--border);background:var(--bg);color:var(--ink);white-space:nowrap}
.chip.need{background:var(--t-need);border-color:var(--mango)}
.chip.work{background:var(--t-work);border-color:var(--work)}

.chip.quiet{background:var(--t-amber);border-color:var(--amber)}
.chip.idle{background:var(--t-idle);border-color:var(--muted2);color:var(--muted)}
.chip.unk{border:1px dashed var(--muted);color:var(--muted)}
.chip.run{background:var(--t-need2);border-color:var(--t-edge)}
.chip.sup{border-color:var(--muted2);color:var(--muted);text-decoration:line-through}
.chip.park{border:1px dashed var(--muted);color:var(--muted)}
/* alerts */
.banner{margin:6px 12px 0;border:1px solid var(--t-edge);border-left:5px solid var(--mango);background:var(--t-need2);border-radius:8px;padding:6px 12px}
.banner.stale{border-color:var(--border);border-left-color:var(--block);background:var(--bg)}.banner.unk{border-left:4px dashed var(--muted);background:var(--bg)}
.banner .t{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.banner .age{margin-left:auto;font-weight:700}
.note{border:1px dashed var(--muted);background:var(--bg);border-radius:6px;padding:5px 9px;margin:4px 0}
.note.out{border-style:solid;border-color:var(--t-edge);background:var(--t-need3)}
.empty{border:1px dashed var(--border);border-radius:8px;padding:10px;margin:4px 0;color:var(--muted);text-align:center;background:var(--bg)}.empty b{color:var(--ink)}
/* canvas + panels */
main{padding:8px 12px 24px}
#canvas{position:relative}
.panel{position:absolute;background:var(--panel);border:1px solid var(--border);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;min-width:0;transition:left .12s,top .12s,width .12s,height .12s}

.panel.rsz{transition:none;z-index:30}

.ph{display:flex;gap:6px;align-items:center;padding:5px 6px 3px 8px;cursor:grab;touch-action:none;user-select:none;border-radius:var(--r) var(--r) 0 0}
.ph:active{cursor:grabbing}
.ph .grip{color:var(--muted2);letter-spacing:-2px;font-size:.92em}
.ph h2{font-size:1em;text-transform:uppercase;letter-spacing:.05em}
.ph .sp{flex:1}
.ph .pbtn{border:1px solid transparent;background:transparent;border-radius:5px;padding:0 6px;color:var(--muted);line-height:1.5}
.ph .pbtn:hover{border-color:var(--border);background:var(--bg);color:var(--ink)}
.count{display:inline-block;min-width:20px;text-align:center;border-radius:10px;background:var(--bg);border:1px solid var(--border);color:var(--muted);font-weight:700;padding:0 6px;font-size:.92em;white-space:nowrap}
.count.hot{background:var(--t-need);border-color:var(--mango);color:var(--ink)}
.count.flt{border-color:var(--mango);color:var(--ink)}
.pb{overflow:auto;padding:2px 10px 8px;flex:1;min-height:0;border-radius:0 0 calc(var(--r) - 1px) calc(var(--r) - 1px)}
.rz{position:absolute;z-index:5}
.rz.n,.rz.s{left:10px;right:10px;height:7px;cursor:ns-resize}.rz.n{top:-3px}.rz.s{bottom:-3px}
.rz.e,.rz.w{top:10px;bottom:10px;width:7px;cursor:ew-resize}.rz.e{right:-3px}.rz.w{left:-3px}
.rz.n:hover,.rz.s:hover,.rz.e:hover,.rz.w:hover{background:var(--t-need);border-radius:4px}
/* corner handles: the mark is an arc concentric with the panel corner (panel radius 10, arc inset 4 => radius 6) */
.rz.ne,.rz.nw,.rz.se,.rz.sw{width:16px;height:16px}
.rz.ne{top:-3px;right:-3px;cursor:nesw-resize}.rz.nw{top:-3px;left:-3px;cursor:nwse-resize}.rz.se{bottom:-3px;right:-3px;cursor:nwse-resize}.rz.sw{bottom:-3px;left:-3px;cursor:nesw-resize}
.rz.ne::after,.rz.nw::after,.rz.se::after,.rz.sw::after{content:"";position:absolute;width:10px;height:10px;border:0 solid transparent}
.rz.se::after{right:6px;bottom:6px;border-right:2px solid var(--muted2);border-bottom:2px solid var(--muted2);border-bottom-right-radius:6px}
.rz.sw::after{left:6px;bottom:6px;border-left-width:2px;border-bottom-width:2px;border-bottom-left-radius:6px}
.rz.ne::after{right:6px;top:6px;border-right-width:2px;border-top-width:2px;border-top-right-radius:6px}
.rz.nw::after{left:6px;top:6px;border-left-width:2px;border-top-width:2px;border-top-left-radius:6px}
.rz.ne:hover::after,.rz.nw:hover::after,.rz.sw:hover::after{border-color:var(--mango)}.rz.se:hover::after{border-color:var(--mango)}
body[data-view=stale] .panel{opacity:.8}

.tbl{width:100%;border-collapse:collapse}

.pb.wt .tbl th{top:calc(var(--tfh,0px) - 2px)}

.nm{font-weight:600}.nw{white-space:nowrap}

.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.item{background:var(--bg);border:1px solid var(--border);border-left:5px solid var(--mango);border-radius:8px;padding:5px 9px}

h3.sec{font-size:.875em;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:8px 0 3px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}h3.sec:first-child{margin-top:2px}
h3.sec .t{text-transform:none;letter-spacing:0;font-weight:400}
/* timeline */

.tl{--tlbg:var(--bg);position:relative}
.tl-bar{position:sticky;top:0;z-index:30;background:var(--tlbg);border-bottom:1px solid var(--border);padding:4px 0 5px;margin-bottom:6px}

 var D0=(U.length?U[0][0]:NOW-HR)-20*MIN,D1=NOW+10*MIN;DOM=[D0,D1];gaps=[];pcs=[];
 if(!S.real)for(var i=0;i+1<U.length;i++){var g=U[i+1][0]-U[i][1];if(g>=S.N*MIN){var pad=Math.min(4*MIN,g/4);gaps.push({s:U[i][1],e:U[i+1][0],cs:U[i][1]+pad,ce:U[i+1][0]-pad})}}
