<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>squad-report rollup</title>
<style>:root{--bg:#FCF8F1;--panel:#F4ECDD;--bd:#E7DBC8;--ink:#3E372E;--mut:#857A68;--faint:#A99C86;--mango:#E8820E;--mango-d:#CE7000;--teal:#0C8A80;--red:#DB3B22;--blue:#2A6DC0;--green:#368A1E;--purple:#9A40CF;--yellow:#9E7A00;--pink:#CE1D6C;--hover:#E8820E12;--sel:#E8820E25;
--c-working:#368A1E;--c-waiting:#2A6DC0;--c-blocking:#DB3B22;--c-idle:#AFA48C;
--k-input:#2A6DC0;--k-cache_read:#0C8A80;--k-cache_write:#9A40CF;--k-output:#E8820E}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
h1{font-size:22px;margin:0}h2{font-size:16px;margin:0}h3{font-size:13px;margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.mut{color:var(--mut)}.faint{color:var(--faint)}.num{font-variant-numeric:tabular-nums;text-align:right}
a{color:var(--blue)}
code{background:var(--panel);padding:1px 5px;border-radius:4px;font-size:12.5px}
:focus-visible{outline:2px solid var(--mango);outline-offset:2px}
/* page */
header.page{padding:18px 24px 10px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--bd)}
header.page .meta{margin-left:auto;text-align:right;font-size:12px;color:var(--mut)}
nav.sections{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--bd);padding:6px 24px;display:flex;gap:4px;flex-wrap:wrap}
nav.sections a{color:var(--mut);text-decoration:none;padding:3px 10px;border-radius:14px;font-size:13px}
nav.sections a:hover{background:var(--hover);color:var(--ink)}nav.sections a.on{background:var(--sel);color:var(--ink);font-weight:600}
main{padding:14px 24px 60px;max-width:1280px;margin:auto}
section{margin:22px 0;scroll-margin-top:80px}
section>.sh{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;flex-wrap:wrap}
section>.sh .sub{color:var(--mut);font-size:12.5px}section>.sh .tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:12px 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:10px}
.kpi .l{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:26px;font-weight:700;line-height:1.15;margin:2px 0}.kpi .s{font-size:12.5px;color:var(--mut)}
.kpi.warn{border-color:var(--mango);box-shadow:inset 3px 0 0 var(--mango)}.kpi.bad{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
.chip{display:inline-block;border-radius:12px;padding:1px 9px;font-size:12px;font-weight:600;border:1px solid var(--bd);background:var(--bg);color:var(--mut);white-space:nowrap}
.chip.run{background:#E8820E22;border-color:var(--mango);color:var(--mango-d)}.chip.done{background:#368A1E18;border-color:var(--green);color:var(--green)}
.chip.bad{background:#DB3B2218;border-color:var(--red);color:var(--red)}.chip.warn{background:#9E7A0018;border-color:var(--yellow);color:var(--yellow)}
.chip.btn{cursor:pointer}.chip.btn:hover{border-color:var(--mango)}.chip.btn[aria-pressed=true]{background:var(--sel);border-color:var(--mango);color:var(--ink)}
.banner{border:1px solid var(--bd);border-left:4px solid var(--mango);background:#fff;border-radius:8px;padding:9px 12px;margin:10px 0;display:flex;gap:10px;align-items:flex-start}
.banner.bad{border-left-color:var(--red)}.banner.info{border-left-color:var(--blue)}.banner b{white-space:nowrap}
.banner .ic{font-weight:800;color:var(--mango)}.banner.bad .ic{color:var(--red)}.banner.info .ic{color:var(--blue)}
/* bars */
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--bd);min-width:60px}
.bar.lg{height:16px;border-radius:8px}.bar i{display:block;height:100%}
.bar i.b-working{background:var(--c-working)}.bar i.b-waiting{background:var(--c-waiting)}
.bar i.b-blocking{background:repeating-linear-gradient(45deg,var(--c-blocking) 0 4px,#E9705B 4px 7px)}.bar i.b-idle{background:var(--c-idle);opacity:.55}
.bar i.k-input{background:var(--k-input)}.bar i.k-cache_read{background:var(--k-cache_read)}.bar i.k-cache_write{background:var(--k-cache_write)}.bar i.k-output{background:var(--k-output)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}.sw{width:11px;height:11px;border-radius:3px;display:inline-block}
.sw.b-working{background:var(--c-working)}.sw.b-waiting{background:var(--c-waiting)}.sw.b-blocking{background:repeating-linear-gradient(45deg,var(--c-blocking) 0 3px,#E9705B 3px 5px)}.sw.b-idle{background:var(--c-idle);opacity:.55}
.sw.k-input{background:var(--k-input)}.sw.k-cache_read{background:var(--k-cache_read)}.sw.k-cache_write{background:var(--k-cache_write)}.sw.k-output{background:var(--k-output)}
.meter{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;margin-top:6px}.meter i{display:block;height:100%;background:var(--teal)}.meter.warn i{background:var(--mango)}.meter.bad i{background:var(--red)}

.dg{display:flex;gap:10px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px 10px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.dg:hover{border-color:var(--mango);background:var(--hover)}.dg .n{font-weight:800;color:var(--mango-d);min-width:16px}.dg .t{font-size:13px}.dg .t small{display:block;color:var(--mut);font-size:12px}

table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 10px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:middle;white-space:nowrap}
th{position:sticky;top:0;background:var(--panel);font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.03em;cursor:pointer;user-select:none}
th.num,td.num{text-align:right}th[aria-sort=ascending]::after{content:" ▲";color:var(--mango)}th[aria-sort=descending]::after{content:" ▼";color:var(--mango)}
th:hover{color:var(--ink)}tbody tr{cursor:pointer}tbody tr:hover{background:var(--hover)}tbody tr.sel{background:var(--sel)}
tbody tr.flag{box-shadow:inset 3px 0 0 var(--red)}tfoot td{font-weight:700;background:var(--panel);cursor:default}
td.tt{max-width:280px;overflow:hidden;text-overflow:ellipsis}td .bar{width:130px;display:inline-flex;vertical-align:middle}
.ret{display:inline-block;min-width:22px;text-align:center;border-radius:11px;padding:0 7px;font-weight:700;background:var(--bd);color:var(--mut)}
.ret.r1{background:#E8820E22;color:var(--mango-d)}.ret.r3{background:var(--red);color:#fff}
.empty{padding:26px;text-align:center;color:var(--mut)}.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.tools input[type=search],.tools select{background:#fff;border:1px solid var(--bd);border-radius:6px;padding:4px 8px;font:inherit;color:var(--ink)}
/* matrix */
.mx td,.mx th{text-align:center;padding:5px 8px}.mx td.rl,.mx th.rl{text-align:left;position:sticky;left:0;background:#fff;z-index:1}.mx th.rl{background:var(--panel)}
.mx td.cell{cursor:pointer;font-variant-numeric:tabular-nums;min-width:68px}.mx td.cell:hover{outline:2px solid var(--mango);outline-offset:-2px}.mx td.cell.sel{outline:2px solid var(--ink);outline-offset:-2px}
.mx td.zero{color:var(--faint)}.mx tr{cursor:default}.mx th{cursor:default}

.tl{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:10px 12px;overflow:hidden}
.tl svg{display:block;width:100%}.tl .lane-l{font-size:12px;fill:var(--ink);cursor:pointer}.tl .lane-l:hover{fill:var(--mango-d);font-weight:700}
.tl .ax{font-size:11px;fill:var(--mut)}.tl .gap{font-size:11px;fill:var(--mut)}
.tl .seg.dim{opacity:.18}.tl .seg-b-blocking{fill:url(#hatch)}
.ev{cursor:pointer}

#drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--bg);border-left:1px solid var(--bd);box-shadow:-8px 0 24px #3E372E22;transform:translateX(105%);transition:transform .18s;z-index:60;overflow:auto;padding:14px 16px}
#drawer.open{transform:none}#drawer .x{position:absolute;top:10px;right:12px;background:none;border:0;font-size:20px;cursor:pointer;color:var(--mut)}
#drawer h2{padding-right:26px}#drawer table{font-size:12.5px}#drawer .tw{margin:6px 0 14px}
button.act{background:var(--mango);color:#FCF8F1;border:0;border-radius:8px;padding:6px 12px;font-weight:600;cursor:pointer}button.act.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--bd)}
#tip{position:fixed;z-index:80;pointer-events:none;background:#3E372E;color:#FCF8F1;font-size:12px;padding:5px 8px;border-radius:6px;max-width:300px;display:none}
.flash{animation:fl 1.4s}@keyframes fl{0%,60%{background:var(--sel)}100%{background:transparent}}
.errbox{max-width:640px;margin:60px auto;text-align:center}.errbox pre{text-align:left;background:var(--panel);border:1px solid var(--bd);border-radius:8px;padding:10px;font-size:12.5px;overflow:auto}
noscript .banner{margin:20px}
@media (max-width:760px){main,header.page{padding-left:12px;padding-right:12px}nav.sections{padding:6px 12px}}
@media print{nav.sections,#drawer,.tools{display:none}.tw{overflow:visible}}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}
.sw.b-po{background:repeating-linear-gradient(45deg,#9A40CF 0 3px,#B966E8 3px 5px)}
.idlesub{margin-top:2px;font-size:12px}
tr.rsn td{border-top:0;padding-top:0;font-size:12.5px;color:var(--ink);white-space:normal;overflow-wrap:anywhere}
.reason{display:block;max-width:100%}

.sc-sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.seg-bar{display:flex;height:18px;border-radius:9px;overflow:hidden;background:var(--bd)}.seg-bar i{display:block;height:100%}
button.dg{width:100%}
